<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#gradient1)"/>

  <!-- Activity/Heart icon -->
  <path d="M 100 70
           L 110 50 L 120 80 L 130 40 L 140 90"
        stroke="white"
        stroke-width="6"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Sync arrows (circular) -->
  <g transform="translate(100, 130)">
    <!-- Right arrow -->
    <path d="M 20 0 A 20 20 0 0 1 0 20 L 8 15 M 0 20 L -5 12"
          stroke="white"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Left arrow -->
    <path d="M -20 0 A 20 20 0 0 0 0 -20 L -8 -15 M 0 -20 L 5 -12"
          stroke="white"
          stroke-width="5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
