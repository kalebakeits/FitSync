apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:16
        command:
          - sh
          - -c
          - |
            until pg_isready -h postgres -p 5432 -U {{ .Values.postgres.username }}; do
              echo "Waiting for postgres..."
              sleep 2
            done
            echo "Postgres is ready!"
      - name: migrate
        image: {{ .Values.imageRegistry }}/{{ .Values.migration.image }}:{{ .Values.migration.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fitsync-secrets
              key: postgres-password
        args:
          - "--connection"
          - "Host=postgres;Port=5432;Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD)"
      containers:
      - name: api
        image: {{ .Values.imageRegistry }}/{{ .Values.api.image }}:{{ .Values.api.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fitsync-secrets
              key: postgres-password
        - name: DataProtectionOptions__DataProtectionKey
          valueFrom:
            secretKeyRef:
              name: fitsync-secrets
              key: data-protection-key
        - name: EmailConfiguration__SmtpPassword
          valueFrom:
            secretKeyRef:
              name: fitsync-email-secret
              key: smtp-password
        - name: WahooOptions__ClientId
          valueFrom:
            secretKeyRef:
              name: fitsync-wahoo-secret
              key: client-id
        - name: WahooOptions__ClientSecret
          valueFrom:
            secretKeyRef:
              name: fitsync-wahoo-secret
              key: client-secret
        - name: WahooOptions__WebhookToken
          valueFrom:
            secretKeyRef:
              name: fitsync-wahoo-secret
              key: webhook-token
        - name: ConnectionStrings__FitSync
          value: "Host=postgres;Port=5432;Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD)"
        - name: ConnectionStrings__kafka
          value: "kafka:9092"
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/appsettings.Production.json
          subPath: appsettings.Production.json
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: api-config
