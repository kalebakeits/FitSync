{{- if .Values.cloudflare.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: {{ .Values.global.namespace }}
data:
  config.yaml: |
    tunnel: d4b81c49-8a03-403c-86dd-f681796fbfd4
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: fitsync.kaleba.app
        path: ^/oauth/consent
        service: http://gui.fitsync.svc.cluster.local:80
      - hostname: fitsync.kaleba.app
        path: ^/(api|oauth|connect|mcp|\.well-known)
        service: http://api.fitsync.svc.cluster.local:8080
      - hostname: fitsync.kaleba.app
        service: http://gui.fitsync.svc.cluster.local:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "pgrep cloudflared"
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: config
        configMap:
          name: cloudflared-config
      - name: creds
        secret:
          secretName: cloudflare-tunnel-creds
{{- end }}
