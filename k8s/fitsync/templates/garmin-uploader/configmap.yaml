apiVersion: v1
kind: ConfigMap
metadata:
  name: garmin-uploader-config
  namespace: {{ .Values.global.namespace }}
data:
  appsettings.Production.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "{{ .Values.logging.level.default }}",
          "Microsoft.Hosting.Lifetime": "{{ .Values.logging.level.microsoft }}",
          "Microsoft.EntityFrameworkCore": "{{ .Values.logging.level.entityFramework }}"
        }
      },
      "ConnectionStrings": {
        "kafka": "{{ .Values.kafka.bootstrapServers }}",
        "redis": "{{ .Values.redis.host }}:{{ .Values.redis.port }}"
      },
      "GarminUploaderOptions": {
        "InstanceId": "{{ .Values.garminUploader.config.instanceId }}",
        "HeartbeatIntervalMinutes": {{ .Values.garminUploader.config.heartbeatIntervalMinutes }},
        "MaxRetries": {{ .Values.garminUploader.config.maxRetries }},
        "OrphanThresholdMinutes": {{ .Values.garminUploader.config.orphanThresholdMinutes }},
        "GarminApiRateLimit": {{ .Values.garminUploader.config.garminApiRateLimit }}
      }
    }
