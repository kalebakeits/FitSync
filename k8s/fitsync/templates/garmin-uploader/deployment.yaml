apiVersion: apps/v1
kind: Deployment
metadata:
  name: garmin-uploader
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.garminUploader.replicas }}
  selector:
    matchLabels:
      app: garmin-uploader
  template:
    metadata:
      labels:
        app: garmin-uploader
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:16
        command:
          - sh
          - -c
          - |
            until pg_isready -h {{ .Values.postgres.host }} -p {{ .Values.postgres.port }} -U {{ .Values.postgres.username }}; do
              echo "Waiting for postgres..."
              sleep 2
            done
            echo "Postgres is ready!"
      - name: wait-for-kafka
        image: busybox:1.35
        command:
          - sh
          - -c
          - |
            until nc -z kafka 9092; do
              echo "Waiting for kafka..."
              sleep 2
            done
            echo "Kafka is ready!"
      containers:
      - name: garmin-uploader
        image: {{ .Values.imageRegistry }}/{{ .Values.garminUploader.image }}:{{ .Values.garminUploader.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fitsync-secrets
              key: postgres-password
        - name: ConnectionStrings__FitSync
          value: "Host={{ .Values.postgres.host }};Port={{ .Values.postgres.port }};Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD)"
        - name: DataProtectionOptions__DataProtectionKey
          valueFrom:
            secretKeyRef:
              name: fitsync-secrets
              key: data-protection-key
        volumeMounts:
        - name: config
          mountPath: /app/appsettings.Production.json
          subPath: appsettings.Production.json
        securityContext:
          capabilities:
            add:
            - SYS_PTRACE
        resources:
          {{- toYaml .Values.garminUploader.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: garmin-uploader-config
