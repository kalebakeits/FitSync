apiVersion: apps/v1
kind: Deployment
metadata:
  name: zwift-fetcher
  namespace: {{ .Values.global.namespace }}
spec:
  replicas: {{ .Values.zwiftFetcher.replicas }}
  selector:
    matchLabels:
      app: zwift-fetcher
  template:
    metadata:
      labels:
        app: zwift-fetcher
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:16
        command:
          - sh
          - -c
          - |
            until pg_isready -h postgres -p 5432 -U {{ .Values.postgres.username }}; do
              echo "Waiting for postgres..."
              sleep 2
            done
            echo "Postgres is ready!"
      - name: wait-for-kafka
        image: busybox:1.35
        command:
          - sh
          - -c
          - |
            until nc -z kafka 9092; do
              echo "Waiting for kafka..."
              sleep 2
            done
            echo "Kafka is ready!"
      containers:
      - name: zwift-fetcher
        image: {{ .Values.imageRegistry }}/{{ .Values.zwiftFetcher.image }}:{{ .Values.zwiftFetcher.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fitsync-secrets
              key: postgres-password
        - name: ConnectionStrings__FitSync
          value: "Host=postgres;Port=5432;Database={{ .Values.postgres.database }};Username={{ .Values.postgres.username }};Password=$(POSTGRES_PASSWORD)"
        - name: DataProtectionOptions__DataProtectionKey
          valueFrom:
            secretKeyRef:
              name: fitsync-secrets
              key: data-protection-key
        volumeMounts:
        - name: config
          mountPath: /app/appsettings.Production.json
          subPath: appsettings.Production.json
        resources:
          {{- toYaml .Values.zwiftFetcher.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: zwift-fetcher-config
