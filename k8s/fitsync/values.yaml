# Global configuration
global:
  namespace: fitsync

# Cloudflare Tunnel configuration
cloudflare:
  enabled: true

# ============================================================================
# SHARED CONFIGURATION (used across multiple services)
# ============================================================================

shared:
  # Email configuration (for auth emails)
  email:
    smtpHost: "smtp.gmail.com"
    smtpPort: 587
    smtpEnableSsl: true
    smtpUsername: "kalebahelp@gmail.com"
    # smtpPassword is stored in k8s secret: fitsync-email-secret
    fromEmail: "kalebahelp@gmail.com"
    fromName: "FitSync"

  # Base fetcher configuration (shared by all fetchers)
  pollIntervalMinutes: 60 # How often to poll for new activities
  lookbackDays: 28 # How many days back to check for activities
  deadThresholdMinutes: 5 # Minutes before considering an uploader dead
  maxPendingActivities: 50 # Max un-uploaded activities before pausing
  heartbeatIntervalMinutes: 1 # Heartbeat frequency
  maxParallelUsers: 4 # Max users processed in parallel
  maxParallelActivities: 10 # Max activities per user in parallel
  maxSequentialCredentialFailures: 5
  appUrl: "https://fitsync.kaleba.app"

imageRegistry: kalebaserver:5000
imagePullPolicy: Always

# ============================================================================
# INFRASTRUCTURE SERVICES
# ============================================================================

# PostgreSQL configuration
postgres:
  image: postgres:16
  storage: 2Gi
  database: FitSync
  username: postgres

# Kafka configuration
kafka:
  image: apache/kafka:latest
  storage: 1Gi
  bootstrapServers: kafka:9092
  topic: "fitsync.activity.fetched"

# Redis configuration
redis:
  image: redis:7-alpine
  storage: 1Gi
  host: redis
  port: 6379

# ============================================================================
# APPLICATION SERVICES
# ============================================================================

# Database migration job
migration:
  enabled: true
  image: fitsync-migrate
  tag: latest

# API configuration
api:
  enabled: true
  image: fitsync-api
  tag: latest
  replicas: 1

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# GUI configuration
gui:
  enabled: true
  image: fitsync-gui
  tag: latest
  replicas: 1

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# ZwiftFetcher configuration
zwiftFetcher:
  enabled: true
  image: fitsync-zwiftfetcher
  tag: latest
  replicas: 1

  config:
    # Instance identifier (useful for tracking in logs/metrics)
    instanceId: "zwift-fetcher-k8s"

    # Zwift-specific API configuration
    zwift:
      authUrl: "https://secure.zwift.com/auth/realms/zwift/protocol/openid-connect/token"
      baseUrl: "https://us-or-rly101.zwift.com"
      clientId: "Zwift_Mobile_Link"
      clientSecret: "TokenSecret"
      amazonS3RateLimit: 500
      zwfitApiRateLimit: 50

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Uploader configuration
uploader:
  enabled: true
  image: fitsync-garminuploader
  tag: latest
  replicas: 1

  config:
    # Instance identifier
    instanceId: "uploader-k8s"

    # Uploader-specific configuration
    heartbeatIntervalMinutes: 1 # How often to send heartbeat
    maxRetries: 3 # Max upload attempts before marking as failed
    orphanThresholdMinutes: 2 # Minutes before reclaiming orphaned work
    garminApiRateLimit: 50 # Garmin API rate limit per minute

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Logging configuration (applied to all services)
logging:
  level:
    default: Debug
    microsoft: Warning
    entityFramework: Warning
